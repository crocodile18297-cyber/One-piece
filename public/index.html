<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>ONE PIECE: GRAND ARENA</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="game"></div><div class="topbar"><div class="brand">☠ GRAND ARENA</div><div class="online"><i></i><span id="online">Подключение...</span></div></div>
